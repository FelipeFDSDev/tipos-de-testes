name: CI - testes automatizados

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testes unitários
        run: python -m pytest tests/unit -m unit -v
      - name: Testes de integração
        run: python -m pytest tests/integration -m integration -v
      - name: Testes de performance
        run: python -m pytest tests/performance -m performance -v --benchmark-columns=min,mean,median,max
