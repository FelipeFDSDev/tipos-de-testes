[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-types-demo"
version = "0.1.0"
description = "API CRUD de pedidos com testes automatizados"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-benchmark>=5.0,<6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "unit: testes unitarios, sem dependencias externas",
  "integration: testes da API e do SQLite em conjunto",
  "performance: medicoes de desempenho com pytest-benchmark",
]
